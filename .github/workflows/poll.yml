name: gym-poll
on:
  # Real cadence comes from an external cron service calling the
  # workflow_dispatch API every 30 min — GitHub's own scheduler throttles
  # high-frequency crons on free private repos down to a few runs a day.
  # This schedule is only a heartbeat so collection survives that service
  # going away, and stays sparse to protect the 2,000 min/month budget.
  schedule:
    - cron: '13 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - shell: pwsh
        env:
          GYM_LOGIN: ${{ secrets.GYM_LOGIN }}
          GYM_PASS:  ${{ secrets.GYM_PASS }}
        run: ./poll.ps1

      - name: debug
        run: |
          echo "--- files ---"
          ls -la
          echo "--- git sees ---"
          git status --porcelain

      - run: |
          git config user.name  bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git diff --staged --quiet || git commit -m "sample $(date -u +%FT%TZ)"
          git pull --rebase
          git push
