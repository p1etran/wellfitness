name: gym-poll
on:
  # Real cadence comes from an external cron service calling the
  # workflow_dispatch API — GitHub's own scheduler throttles high-frequency
  # crons down to a few runs a day, so this schedule is a fallback, not the
  # primary trigger. It exists so collection survives that service going
  # away. Minutes are free on public repos, so it costs nothing to leave a
  # frequent expression here and let GitHub fire it whenever it feels like.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - shell: pwsh
        env:
          GYM_LOGIN: ${{ secrets.GYM_LOGIN }}
          GYM_PASS:  ${{ secrets.GYM_PASS }}
        run: ./poll.ps1

      - name: debug
        run: |
          echo "--- files ---"
          ls -la
          echo "--- git sees ---"
          git status --porcelain

      - run: |
          git config user.name  bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git diff --staged --quiet || git commit -m "sample $(date -u +%FT%TZ)"
          git pull --rebase
          git push
