name: gym-poll
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GYM_LOGIN: ${{ secrets.GYM_LOGIN }}
          GYM_PASS:  ${{ secrets.GYM_PASS }}
        run: ./poll.ps1
      - run: |
          git config user.name  bot
          git config user.email bot@users.noreply.github.com
          git pull --rebase
          git add samples.csv
          git diff --staged --quiet || git commit -m "sample $(date -u +%FT%TZ)"
          git push
